name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Before GOTOOLCHAIN is pinned: task itself may need a newer Go.
      - name: install task
        run: GOTOOLCHAIN=auto go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: pin the toolchain from go.mod
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release must be what `task all` builds from the same tag.
      - name: release matches task
        run: |
          mkdir -p check && cd check
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          cd .. && task clean all VERSION="$GITHUB_REF_NAME"
          cd dist && sha256sum -c ../check/SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
